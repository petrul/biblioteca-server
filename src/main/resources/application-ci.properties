spring.main.allow-bean-definition-overriding=true

# 9 test classes each do a full fixture-corpus import (reimportAllTeis) -
# without these, every one of them would ALSO trigger a real Lucene
# rebuild against the shared dev index path (only WebITest isolates its
# own) and real SearXNG/Wikipedia/Ollama calls per imported author/opus,
# on every single test run. WebITest is the one place that actually
# wants this real integration coverage - it re-enables both explicitly
# via its own @TestPropertySource.
lucene.autoindex.enabled=false
lucene.incremental.enabled=false
enrichment.enabled=false



# The int stage shares the prod qdrant instance - its collections are
# the prod names with the int- prefix (see vector.collection.prefix).
vector.collection.prefix=int-
