<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${author.visualName + ' — ' + opus.head}">Author — Work</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Same fonts as teidiv.html, for visual consistency with the rest of
         the site - deliberately no Bootstrap/breadcrumb/navbar chrome here,
         this page is meant to be embedded (iframe) elsewhere as much as
         viewed standalone. -->
    <link href="https://fonts.googleapis.com/css?family=Alegreya:400,400i,700|PT+Sans+Narrow" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/quote.css}" href="../static/css/quote.css" type="text/css" />

    <meta name="author" th:content="${author.visualName}" />
    <meta property="og:type" content="article" />
    <meta property="og:title" th:text="${author.visualName + ' — ' + opus.head}" />
</head>
<body>
    <div class="quote-card">
        <blockquote class="quote-text">
            <p th:each="paragraph : ${paragraphs}" th:text="${paragraph}">Quoted text.</p>
        </blockquote>
        <div class="quote-citation">
            <a th:href="@{${sourceUrl}(noredirect=${noredirect})}" th:text="${author.visualName}">Author Name</a>
            <span class="quote-citation-sep">&mdash;</span>
            <a th:href="@{${sourceUrl}(noredirect=${noredirect})}" th:text="${opus.head}">Work Title</a>
        </div>
    </div>
</body>
</html>
