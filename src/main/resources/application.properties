### generic for all profiles
app.name=Biblioteca Server
app.description=Biblioteca is a structured digital library
server.port=8080

spring.kafka.bootstrap-servers=${KAFKA_BROKERS}
# host:port - host and port only ever travel together to address one
# service, so each is a single pass-store secret (see VectorConfig's
# hostOf/portOf, which strips the http:// the pass store's own value
# carries) rather than two.
# The address of whichever vector store is active - one env var for all
# stores on purpose: switching stores (vector.store below) must never
# require also remembering to switch address variables. VECTORSTORE_URL is
# the canonical name; the MILVUS_URL fallback keeps every existing
# deployment/pass-store entry working unchanged until its key is renamed.
# The value is a real "http://host:port" URL (or bare host:port).
vectorstore.address=${VECTORSTORE_URL:${MILVUS_URL:}}
# Which store backs the VectorCollection the search/availability layer
# depends on: qdrant (the default - the shared prod instance serves every
# environment, with per-environment collection names) or milvus (the
# historic store, still fully supported).
vector.store=${VECTOR_STORE:qdrant}
# Base collection name - the convention-carrying identifier derived from
# the active embedder (see MilvusTextSearchService's compatibility
# check). The same base name is used by every store; a non-prod
# environment distinguishes its collections with the prefix below.
vector.collection=${VECTOR_COLLECTION:biblioteca_paras_bge_m3}
# Prepended to the base collection name so dev/int stages can share the
# one prod store instance without ever touching prod data - empty (prod)
# by default; the dev/int profile property files set dev-/int-.
vector.collection.prefix=${VECTOR_COLLECTION_PREFIX:}
# Entries are comma-separated: url|basepath|filespec. Local URLs are paths or
# file: URLs; SSH/HTTP(S)/Git URLs are cloned read-only with the system git.
repo.tei.repos=${TEI_REPOS}
work.dir=${WORK_DIR:/work}
cache.dir=${work.dir}/cache
# Local Lucene full-text index directory - not an external service, so a
# derived default (unlike milvus.address/embedder.address etc, which fail
# fast with no default - see cache.dir above for the same reasoning) is fine.
lucene.index.dir=${LUCENE_INDEX_DIR:${cache.dir}/lucene-index}
# Auto-builds the Lucene index on startup if it doesn't exist yet, instead
# of requiring a manual POST /api/admin/lucene/reindex - runs on a
# background, minimum-priority thread so it doesn't block startup or
# compete hard with the actual application for CPU (see
# LuceneIndexService.autoBuildIndexOnStartup). Escape hatch in case that's
# still not enough on some machine/profile.
lucene.autoindex.enabled=true
# Cooling pace of a full index build: after each opus, pause for this
# fraction of the time that opus took to index (0 disables) - the build
# is background work and yields the box proportionally-sized gaps
# instead of competing flat-out with everything else on it.
lucene.build.cooldown.factor=0.5
embedder.address=${EMBEDDER_URL}

# Ollama server backing the BGE-M3 default and optional Qwen/Nomic embedders.
ollama.host=zmeu.local
ollama.port=11434

# Sentence-transformers server backing the STS-based embedders (see
# VectorConfig). Same "one fixed instance across every profile" reasoning as
# ollama.host/port above - decoupled from it since they're different
# services at different addresses, not interchangeable.
sts.host=mini.local
sts.port=11200

# SearXNG instance (docker/searxng in the scripts repo) - same "one fixed
# instance across every profile" reasoning as ollama.host/port above. Not
# yet behind Caddy/a real hostname, LAN-only.
searxng.host=zmeu.local
searxng.port=8095

# Author bio, work summary, structured facts, and representative image URLs.
# Enrichment uses SearXNG plus Wikipedia/Wikidata directly; Ollama remains
# separately configured above for vector embeddings only.
# Off by default under the ci profile (application-ci.properties) - see
# there for why.
enrichment.enabled=true

# Host, db name, user and password only ever combine into this one JDBC
# URL - nothing else in this app reads them separately - so they're
# externalized as that single pass-store secret rather than four.
# Hibernate's own boot log would otherwise print this verbatim (including
# the credentials) at INFO - see
# logging.level.org.hibernate.orm.connections.pooling below, and
# RunStuffOnStartup's own redacted log line for the one place this should
# still be visible.
spring.datasource.url=${MYSQL_URL}


spring.datasource.testWhileIdle = true
spring.datasource.validationQuery = SELECT 1
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.show-sql = false
spring.jpa.hibernate.ddl-auto = update

logging.level=INFO
logging.level.org.springframework=INFO
logging.level.com=INFO
# Keep logger columns readable while retaining the class name: for example,
# ro.editii.scriptorium.model.TeiElem is rendered as r.e.s.m.TeiElem.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:} --- [%15.15t] %-40.40logger{15} : %m%n%wEx
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:} --- [%t] %-40.40logger{15} : %m%n%wEx
# Prints the full JDBC URL verbatim (HHH10001005 "Database info") -
# including the credentials MYSQL_URL now embeds. RunStuffOnStartup's
# own redacted "jdbc url: ..." log line is the one place this should
# still be visible at runtime.
logging.level.org.hibernate.orm.connections.pooling=WARN

server.error.include-stacktrace=never
server.error.include-message=always

springdoc.swagger-ui.path=/api/ui
springdoc.api-docs.path=/api/docs
# Keep Swagger UI's bootstrap configuration and document URL aligned with
# springdoc.api-docs.path. A stale configUrl previously made the UI load but
# fail with "Failed to load remote configuration" in production.
springdoc.swagger-ui.configUrl=/api/docs/swagger-config
springdoc.swagger-ui.url=/api/docs

### these are profile-specific

textbase.advertised.url=${BIBLIOTECA_EXTERNAL_URL:https://textbase.scriptorium.ro}
spring.data.rest.basePath=/api/drest/

# Google One Tap / Sign in with Google (see GoogleTokenInfoVerifier,
# GoogleAuthController, fragments/google-one-tap.html). Deliberately
# defaults to blank rather than a guessed value - GoogleTokenInfoVerifier
# treats a blank client id as "feature not configured yet" and refuses
# every credential rather than silently accepting tokens meant for some
# other Google app. Get a real one from https://console.cloud.google.com/
# (OAuth 2.0 Client ID, Web application, with this app's origin listed
# under Authorized JavaScript origins) and set GOOGLE_OAUTH_CLIENT_ID.
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

# Paragraph size window for vectorization, exported to biblioteca-nestjs
# through GET /api/admin/config (see ConfigRestController/SharedConfigDto):
# paragraphs strictly shorter than minChars are not embedded at all
# (measured corpus noise below ~20 chars: BOMs, reference ids, bare
# numerals, speaker labels), while paragraphs longer than maxChars are
# TRUNCATED to maxChars before embedding instead of dropped, so long
# expository paragraphs and <table> blocks stay searchable. The nestjs
# vectorizer additionally clamps maxChars to the active embedder's own
# context window (ContentEmbedder.maxContextChars there), so raising
# maxChars here can never overflow the model.
vectorizer.para.minChars=20
vectorizer.para.maxChars=3000
