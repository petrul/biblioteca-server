// load .env.xxx for dev or test execution
final profile = getProfile()
def getProfile() {
    if (project.hasProperty('dev')) return 'dev' // you can call it with -Pdev
    if (project.hasProperty('ci'))  return 'ci'
    if (project.hasProperty('prod'))  return 'prod'
    if (project.hasProperty('profile')) return project.property('profile')
    'dev' // default
}
println "profile: ${profile}"
// ProcessForkOptions covers both bootRun (JavaExec) and test (Test)
tasks.withType(ProcessForkOptions).configureEach { task ->
    // TeamCity/Vault/process environment values take precedence. A local
    // dotenv file is an optional developer fallback and never overwrites an
    // injected secret.
    task.doFirst {
        final taskProfile = task instanceof Test
                ? (task.systemProperties['spring.profiles.active'] ?: profile)
                : profile
        final envFile = file(".env.${taskProfile}")
        final props = new Properties()
        if (envFile.exists()) {
            envFile.withInputStream { props.load(it) }
            int fallbackCount = 0
            props.each { key, val ->
                if (System.getenv(key.toString()) == null) {
                    task.environment(key.toString(),
                            val.toString().replaceFirst('^~', System.getProperty('user.home')))
                    fallbackCount++
                }
            }

            final addFallback = { String key, String value ->
                if (value != null && !value.isBlank() &&
                        System.getenv(key) == null && props.getProperty(key) == null) {
                    task.environment(key, value)
                    props.setProperty(key, value)
                    fallbackCount++
                }
            }
            final addressFrom = { String hostKey, String portKey ->
                final host = props.getProperty(hostKey)
                final port = props.getProperty(portKey)
                host == null ? null : (port == null || host.contains(':') ? host : "${host}:${port}")
            }
            addFallback('MILVUS_ADDRESS', addressFrom('MILVUS_HOST', 'MILVUS_PORT'))
            addFallback('EMBEDDER_ADDRESS', addressFrom('EMBEDDER_HOST', 'EMBEDDER_PORT'))
            if (System.getenv('REPO_TEI_REPOS') == null) {
                final legacyRepo = System.getenv('REPO_TEI_DIRS') ?: props.getProperty('REPO_TEI_DIRS')
                addFallback('REPO_TEI_REPOS', legacyRepo)
            }

            final mysqlHost = addressFrom('MYSQL_HOST', 'MYSQL_PORT')
            final mysqlDb = props.getProperty('MYSQL_DB')
            final mysqlUser = props.getProperty('MYSQL_USER')
            final mysqlPassword = props.getProperty('MYSQL_PASSWORD')
            if ([mysqlHost, mysqlDb, mysqlUser, mysqlPassword].every { it != null }) {
                final encode = { String value -> URLEncoder.encode(value, StandardCharsets.UTF_8) }
                addFallback('MYSQL_JDBC_URL',
                        "jdbc:mysql://${mysqlHost}/${mysqlDb}" +
                        "?user=${encode(mysqlUser)}&password=${encode(mysqlPassword)}" +
                        '&autoReconnect=true&useSSL=false&noAccessToProcedureBodies=true' +
                        '&serverTimezone=Europe/Bucharest&useTimezone=false&allowPublicKeyRetrieval=true')
            }
            println "> Applied ${fallbackCount} local fallback value(s) from ${envFile.name} to task '${task.name}'"
        }

        if (task.name != 'unittest') {
            final requiredKeys = [
                    "MILVUS_ADDRESS", "EMBEDDER_ADDRESS",
                    "REPO_TEI_REPOS", "KAFKA_BROKERS",
                    "MYSQL_JDBC_URL"
            ]
            final missingKeys = requiredKeys.findAll {
                System.getenv(it) == null && props.getProperty(it) == null
            }
            if (!missingKeys.isEmpty()) {
                throw new GradleException(
                        "Missing required ${taskProfile} configuration: ${missingKeys.join(', ')}. " +
                        "Inject it through Vault/TeamCity environment variables or provide ${envFile.name}.")
            }
        }
    }
}
