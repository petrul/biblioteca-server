def static getGitLatestCommit() {
    final String cmd = 'git log -n 1 --pretty=format:%H 2>&1'
    final String str = cmd.execute().text.trim()
    return str
}

processResources {
    // interested particularly in application.properties and version.properties
//    println "version.properties var expansion ..."
    filesMatching("**/version.properties") {
        final prop = [
            "buildnumber" : System.getenv()['BUILD_NUMBER'],
            "version" : project.properties['version'],
            'builddate' : new Date().toString(),
            'git_latest_commit': getGitLatestCommit(),
            'git_branch': 'git rev-parse --abbrev-ref HEAD'.execute().text.trim(),
            'buildmachine' : 'hostname'.execute().text
        ]
        filter ( line -> {
            Matcher m = line =~ /(@@([\w\_\.]+)@@)/
            if (m) {
                final outer = m[0][1]
                final inner = m[0][2]
                if (prop[inner]) {
                    final resp = line.replaceAll(outer, prop[inner])
                    return resp
                } else
                    line
            } else
                return line
        })
    }
}

