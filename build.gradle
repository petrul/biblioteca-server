bootRun {
    jvmArgs '-Xss10m' // add line
    final profileProperty = ['dev', 'ci', 'prod'].find { project.hasProperty(it) }
    final configuredProfiles = System.getenv('SPRING_PROFILES_ACTIVE') ?: profileProperty
    final activeProfiles = ['autoimport']
    if (configuredProfiles != null && !configuredProfiles.isBlank()) {
        activeProfiles.addAll(configuredProfiles.split(',').findAll { !it.isBlank() })
    }
    systemProperties['spring.profiles.active'] = activeProfiles.join(',')
    println "bootRun: spring.profiles.active = " + systemProperties['spring.profiles.active']
}


tasks.withType(Test).configureEach {
    jvmArgs '-Xss10m' // needed for the recursion of serializing DOM Nodes
    // $ ./gradlew -Pci unittest   or   $ ./gradlew -Pci test
    // NOTE: no '-Ptest' case here on purpose - every Gradle project with the
    // java/groovy plugins already has a task named 'test', and Gradle exposes
    // tasks as dynamic properties on the project, so hasProperty('test') is
    // ALWAYS true regardless of any -P flag actually passed. Learned this the
    // hard way: it was silently overriding -Pdev/-Pci/-Pprod every time.
    if (project.hasProperty('dev')) systemProperty 'spring.profiles.active', 'dev'
    if (project.hasProperty('ci'))  systemProperty 'spring.profiles.active', 'ci'
    if (project.hasProperty('prod'))  systemProperty 'spring.profiles.active', 'prod'
    final resolvedProfile = systemProperties['spring.profiles.active'] ?: System.getenv('SPRING_PROFILES_ACTIVE') ?: '(none)'
    println "${name}: spring.profiles.active = " + resolvedProfile
//    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
}

