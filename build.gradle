import java.util.regex.Matcher
import java.net.URLEncoder
import java.nio.charset.StandardCharsets

buildscript {
    dependencies {
        classpath('io.swagger:swagger-codegen:2.4.14')
    }
}

plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'groovy'
    id 'eclipse'
    id 'idea'
    id "maven-publish"
    id 'org.hidetake.swagger.generator' version  '2.19.2'
    // Not invoked by any normal build/CI task yet (`nativeCompile`/
    // `nativeBuild` must be run explicitly) - added so a GraalVM native
    // image build is available to try against a release branch, without
    // adding native-image build time (several minutes+) to every
    // SNAPSHOT build. Spring Boot's own AOT processing kicks in
    // automatically once this plugin is present; no separate AOT plugin
    // id is needed on Boot 3+/4.x. Milvus SDK's gRPC/Netty stack is the
    // dependency most likely to need extra reachability-metadata hints
    // (graalvmNative { binaries { main { ... } } }) the first time this
    // is actually tried - not added preemptively, since guessed hints
    // are worse than none.
    id 'org.graalvm.buildtools.native' version '1.1.11'
}

// Spring Boot exposes AOT tasks as soon as the native plugin is applied. Keep
// those tasks completely out of ordinary test/run/build work; native
// compilation is an explicit, opt-in measurement step.
def graalvmRequested = project.hasProperty('graalvm')
tasks.matching { it.name in ['processAot', 'processTestAot'] }.configureEach {
    enabled = graalvmRequested
}
// Spring Boot may register processTestAot after the initial task collection;
// enforce the same opt-in rule once all plugins have finished configuring.
gradle.projectsEvaluated {
    ['processAot', 'processTestAot'].each { taskName ->
        tasks.findByName(taskName)?.enabled = graalvmRequested
    }
}

idea {
    module {
        excludeDirs += files("node_modules")
    }
}

