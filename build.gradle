tasks.named('test') {
    // The conventional test task is the complete suite: local tests plus
    // tests that exercise integration-deps. Plain `gradlew test` therefore
    // defaults to the CI profile and its integration-deps environment.
    useJUnitPlatform()
    // The store-integration tests (SearchITest et al.) create and drop their
    // own fresh collections and re-run the availability check themselves -
    // the periodic recheck must not flip `available` inside that window, or
    // the tests become a race with a moving target (observed as CI build
    // 7223: SearchITest.ann() asserting empty hits). Production keeps the
    // periodic recheck; tests get the deterministic startup-check behavior.
    systemProperty 'vector.search.availability-recheck.enabled', 'false'
    // Profile resolution itself lives in the shared tasks.withType(Test)
    // block below (applies to this task too, since it's Test-typed) -
    // nothing extra needed here.
}

tasks.register('unittest', Test) {
    description = 'Runs only network-free unit and local component tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        excludeTags 'integration-test'
    }
    systemProperty 'vector.search.availability-check.enabled', 'false'
}

tasks.register('integrationTest', Test) {
    description = 'Runs tests that deliberately exercise external integration services.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration-test'
    }
    shouldRunAfter tasks.named('unittest')
    // Profile resolution (jvmArgs too) comes from the shared
    // tasks.withType(Test) block below - this task is Test-typed too.
    // Same reasoning as the test task above: the store-integration tests
    // manage the availability flag themselves around their own collections.
    systemProperty 'vector.search.availability-recheck.enabled', 'false'
}

