repositories {
    mavenLocal()
    mavenCentral()
    maven {url "https://plugins.gradle.org/m2/"}
    maven { url = "file:///gv0/repo/releases" }
    maven { url = "file:///gv0/repo/snapshots" }
}

tasks.named('test') {
    // The conventional test task is the complete suite: local tests plus
    // tests that exercise integration-deps. Plain `gradlew test` therefore
    // defaults to the CI profile and its integration-deps environment.
    useJUnitPlatform()
    if (!['dev', 'ci', 'prod'].any { project.hasProperty(it) } &&
            System.getenv('SPRING_PROFILES_ACTIVE') == null) {
        systemProperty 'spring.profiles.active', 'ci'
    }
}

tasks.register('unittest', Test) {
    description = 'Runs only network-free unit and local component tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        excludeTags 'external'
    }
    systemProperty 'vector.search.availability-check.enabled', 'false'
}

tasks.register('integrationTest', Test) {
    description = 'Runs tests that deliberately exercise external integration services.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'external'
    }
    shouldRunAfter tasks.named('unittest')
    jvmArgs '-Xss10m'
    systemProperty 'spring.profiles.active', 'ci'
    doFirst {
        if (profile != 'ci') {
            throw new GradleException("integrationTest requires -Pci so it uses the CI/integration-deps configuration")
        }
    }
}

clean.doFirst {
    delete "${rootDir}/out/"
}

