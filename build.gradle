// docker

def runShellCommand(String cmd) {
    p "will run \$ $cmd"
    final proc = cmd.execute()
    p "stdout follows: "
    p "==============="
    p proc.text
    proc.waitFor()

    final exitValue = proc.exitValue()
    p "exit value: $exitValue"
    if (exitValue != 0) {
        throw new GroovyRuntimeException("cmd $cmd finished with non-zero exit value $exitValue")
    }
}

