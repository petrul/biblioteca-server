final profile = resolveProfile()
// Single source of truth for "which profile is this run for", used by
// bootRun and every Test task above, and by the dotenv fallback loader
// below: -Pprofile=<profile> (what the rakefile always passes - a
// hostname by default, e.g. zmeu) wins; SPRING_PROFILES_ACTIVE covers a
// bare `./gradlew` invocation with no rakefile involved at all; fallback
// is the caller's own default (Test tasks want 'ci', everything else 'dev').
def resolveProfile(String fallback = 'dev') {
    if (project.hasProperty('profile')) return project.property('profile').toString()
    if (System.getenv('SPRING_PROFILES_ACTIVE')) return System.getenv('SPRING_PROFILES_ACTIVE')
    fallback
}
println "profile: ${profile}"
// ProcessForkOptions covers both bootRun (JavaExec) and test (Test)
tasks.withType(ProcessForkOptions).configureEach { task ->
    // TeamCity/Vault/process environment values take precedence. A local
    // dotenv file is an optional developer fallback and never overwrites an
    // injected secret.
    task.doFirst {
        final taskProfile = task instanceof Test
                ? (task.systemProperties['spring.profiles.active'] ?: profile)
                : profile
        final envFile = file(".env.${taskProfile}")
        final props = new Properties()
        if (envFile.exists()) {
            envFile.withInputStream { props.load(it) }
            int fallbackCount = 0
            props.each { key, val ->
                if (System.getenv(key.toString()) == null) {
                    task.environment(key.toString(),
                            val.toString().replaceFirst('^~', System.getProperty('user.home')))
                    fallbackCount++
                }
            }

            final addFallback = { String key, String value ->
                if (value != null && !value.isBlank() &&
                        System.getenv(key) == null && props.getProperty(key) == null) {
                    task.environment(key, value)
                    props.setProperty(key, value)
                    fallbackCount++
                }
            }
            final addressFrom = { String hostKey, String portKey ->
                final host = props.getProperty(hostKey)
                final port = props.getProperty(portKey)
                host == null ? null : (port == null || host.contains(':') ? host : "${host}:${port}")
            }
            addFallback('MILVUS_URL', addressFrom('MILVUS_HOST', 'MILVUS_PORT'))
            addFallback('EMBEDDER_URL', addressFrom('EMBEDDER_HOST', 'EMBEDDER_PORT'))

            // DB_URL carries the credentials as Derby connection attributes
            // (see application.properties) - one value, nothing else to
            // synthesize for the database.
            final dbHost = addressFrom('DB_HOST', 'DB_PORT')
            final dbName = props.getProperty('DB_NAME')
            if (dbHost != null && dbName != null) {
                final dbUser = props.getProperty('DB_USER')
                final dbPassword = props.getProperty('DB_PASSWORD')
                final creds = (dbUser != null && dbPassword != null)
                        ? ";user=${dbUser};password=${dbPassword}" : ''
                addFallback('DB_URL', "jdbc:derby://${dbHost}/${dbName};create=true${creds}")
            }
            println "> Applied ${fallbackCount} local fallback value(s) from ${envFile.name} to task '${task.name}'"
        }

        if (task.name != 'unittest') {
            // VECTORSTORE_URL is the canonical name; MILVUS_URL remains an
            // accepted alternative until the pass-store key is renamed
            // everywhere, so each entry lists the names that can satisfy it.
            final requiredKeys = [
                    ['VECTORSTORE_URL', 'MILVUS_URL'],
                    ['EMBEDDER_URL'],
                    ['TEI_REPOS'],
                    ['KAFKA_BROKERS'],
                    ['DB_URL']
            ]
            final missingKeys = requiredKeys.findAll { alternatives ->
                alternatives.every { System.getenv(it) == null && props.getProperty(it) == null }
            }.collect { alternatives -> alternatives.join(' or ') }
            if (!missingKeys.isEmpty()) {
                throw new GradleException(
                        "Missing required ${taskProfile} configuration: ${missingKeys.join(', ')}. " +
                        "Inject it through Vault/TeamCity environment variables or provide ${envFile.name}.")
            }
        }
    }
}
