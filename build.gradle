dependencies {

//	implementation('org.springframework.boot:spring-boot-starter-data-cassandra')
//	implementation('org.springframework.boot:spring-boot-starter-data-elasticsearch')
	implementation('org.springframework.boot:spring-boot-starter-data-jpa')
	// Native-image support for Hibernate: substitutions plus a GraalVM
	// feature that registers JPA entity classes (reflection/class-init) at
	// image build time. Without it the AOT-processed app starts Tomcat and
	// the connection pool, then dies at EntityManagerFactory creation with
	// "Unable to load class [ro.editii.scriptorium.model.Author]"
	// (observed booting the 0.9.6-SNAPSHOT-graalvm image). Only the
	// -Pgraalvm nativeCompile path needs it; the plain JVM build carries
	// the jar unused. Version pinned to the hibernate-core the Boot BOM
	// resolves (7.4.1.Final today) because Boot does not manage this
	// artifact itself.
	implementation('org.hibernate.orm:hibernate-graalvm:7.4.1.Final')
	// DerbyDialect isn't in hibernate-core (unlike the old MySQLDialect) -
	// Hibernate 6+ moved less-common dialects into this separate module.
	implementation('org.hibernate.orm:hibernate-community-dialects:7.4.1.Final')
	// Same minimal role as wavelen-market-data's own Flyway adoption: ddl-auto
	// (application.properties) keeps doing the routine day-to-day schema
	// work, Flyway is only for the rare fix-forward migration when
	// Hibernate's auto-DDL leaves something broken behind. Pinned below
	// Spring Boot's own BOM-managed version (12.4.0 at Boot 4.1.0)
	// deliberately: that version dropped Apache Derby support entirely
	// (confirmed by actually booting against it - "FlywayException:
	// Unsupported Database: Apache Derby 10.17" - Derby was moved behind
	// Flyway's paid Enterprise tier at some point after 9.x). Just the
	// bare flyway-core artifact, not the spring-boot-starter-flyway
	// wrapper - Spring Boot's FlywayAutoConfiguration only needs
	// Flyway.class on the classpath to activate, regardless of which
	// artifact put it there.
	implementation('org.flywaydb:flyway-core:9.22.3')
	implementation('org.springframework.boot:spring-boot-starter-data-rest')
	implementation('org.springframework.boot:spring-boot-starter-web')
	implementation('org.springframework.boot:spring-boot-starter-restclient')
	implementation("org.springframework.boot:spring-boot-starter-thymeleaf")
    implementation("org.springframework.boot:spring-boot-starter-security")
    implementation("org.springframework.boot:spring-boot-starter-cache")
    implementation("org.springframework.boot:spring-boot-starter-validation")
    implementation('org.springframework.boot:spring-boot-starter-kafka')
    // Standard /actuator/health (used by the overnight watcher instead of
    // an ad-hoc endpoint) and /actuator/metrics - the lucene/vectorizing
    // progress bars still come from their own domain-specific status
    // endpoints, actuator doesn't know about those.
    implementation('org.springframework.boot:spring-boot-starter-actuator')

    implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2')

    implementation('com.github.ben-manes.caffeine:caffeine')

    implementation group: 'commons-cli', name: 'commons-cli', version: '1.4'
    // Spring Boot's dependency management (its imported BOM) pins EVERY
    // Derby artifact at its own older Derby - 10.16.1.1 at Boot 4.1.0.
    // The explicit versions on derbyclient/derby below win for those two,
    // but their transitive derbyshared still gets the BOM's 10.16.1.1 - a
    // mixed version set Derby refuses (observed in CI: the tests' embedded
    // driver, org.apache.derby.jdbc.EmbeddedDriver, failed to load because
    // derby 10.17 cannot link against derbyshared 10.16; overriding Boot's
    // derby.version property did NOT cover derbyshared). Explicit
    // declarations beat the BOM's managed version, so pin derbyshared
    // itself, on both configurations that carry the Derby jars.
    runtimeOnly 'org.apache.derby:derbyshared:10.17.1.0'
    // Derby Network Server client - was mysql:mysql-connector-java. Just
    // the client jar: this app is a client of a standalone Derby Network
    // Server (see docker/biblioteca's derby service), never embedded.
    runtimeOnly 'org.apache.derby:derbyclient:10.17.1.0'

	implementation group: 'commons-io', name: 'commons-io', version: '2.6'
    implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.4'
    implementation 'org.apache.commons:commons-lang3'
    implementation group: 'org.apache.commons', name: 'commons-text', version: '1.1'
    implementation group: 'com.ibm.icu', name: 'icu4j', version: '71.1'

    implementation group: 'net.sf.saxon', name: 'Saxon-HE', version: '9.9.0-2'
    implementation 'org.codehaus.groovy:groovy-all:3.0.25'

    implementation group: 'org.apache.lucene', name: 'lucene-core', version: luceneVersion
    implementation group: 'org.apache.lucene', name: 'lucene-queryparser', version: luceneVersion
    implementation group: 'org.apache.lucene', name: 'lucene-queries', version: luceneVersion
    // Was 'lucene-analyzers-common:8.11.2' - that artifact was renamed to
    // 'lucene-analysis-common' from Lucene 9 onward, and the 8.x jar doesn't
    // match lucene-core 9.9.1's API (e.g. IndexSearcher.doc() -> storedFields()).
    // lucene-demo/lucene-snowball dropped: unused (no demo code; the
    // per-language stemmers this module ships - RomanianAnalyzer etc, see
    // search/lucene/LuceneAnalyzers.java - cover stemming instead).
    implementation group: 'org.apache.lucene', name: 'lucene-analysis-common', version: luceneVersion

    // Detects a TEI document's language from its own text at import time
    // (see LanguageDetectionService) - replaces guessing the language from
    // the file's directory path (TeiDirRepoImpl.getLanguageHint), which
    // silently returned null for anything not filed under a language-coded
    // folder. Pure JVM, no native/network dependency, ships its own
    // per-language n-gram models.
    implementation 'com.github.pemistahl:lingua:1.2.2'

    implementation 'io.milvus:milvus-sdk-java:2.3.4'

    implementation 'com.seanox:seanox-spring-webdav:3.5.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly('org.springframework.boot:spring-boot-devtools')
	testImplementation('org.springframework.boot:spring-boot-starter-test')
    testImplementation('org.springframework.boot:spring-boot-starter-kafka-test')
    testImplementation('org.springframework.boot:spring-boot-starter-restclient-test')
    testImplementation('org.springframework.boot:spring-boot-starter-webmvc-test')
    // Embedded Derby engine, for tests only - the app itself is a pure
    // Network Server client (see runtimeOnly derbyclient above) and never
    // links the embedded engine, but tests use jdbc:derby:memory:... URLs
    // (see each @TestPropertySource / GTestUtil's in-memory props), which
    // only the embedded driver (not derbyclient, which only accepts
    // jdbc:derby://... URLs) can open - was h2.
    testImplementation 'org.apache.derby:derby:10.17.1.0'
    // Same mixed-version trap as the runtimeOnly derbyshared above, for the
    // test classpath - the BOM's 10.16.1.1 must not ride along here either.
    testImplementation 'org.apache.derby:derbyshared:10.17.1.0'
    // Validates real serialized Kafka event DTOs against asyncapi.yml's
    // own schemas (AsyncApiContractTest) - the same "does the checked-in
    // spec actually match what we produce" check
    // exportedOpenApiYamlIsValidAndInternallyConsistent already does for
    // the REST side, just for the hand-maintained async side instead of
    // a live-generated one.
    // Pinned to the 1.x line deliberately - 3.x is a from-scratch API
    // rewrite (Schema/Validator instead of JsonSchema/JsonSchemaFactory)
    // that isn't worth chasing here.
    testImplementation 'com.networknt:json-schema-validator:1.5.9'


