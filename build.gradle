bootRun {
    jvmArgs '-Xss10m' // add line
    // resolveProfile() (below) is the single source of truth: the rakefile
    // always passes -Pprofile=<profile> (biblioteca/<profile> in the pass
    // store - a hostname by default, e.g. zmeu, see the rakefile's own
    // Socket.gethostname fallback). 'autoimport' is always included on top
    // of that - it's a standing behavior flag for local bootRun, not a
    // profile choice itself (see `$ gradle bootRun -Pprofile=air,autoimport`
    // further down for the pattern this replaced).
    final activeProfiles = ((project.hasProperty('noAutoImport') ? [] : ['autoimport']) + resolveProfile().split(',').toList()).findAll { !it.isBlank() }.unique()
    systemProperties['spring.profiles.active'] = activeProfiles.join(',')
    println "bootRun: spring.profiles.active = " + systemProperties['spring.profiles.active']
}


tasks.withType(Test).configureEach {
    jvmArgs '-Xss10m' // needed for the recursion of serializing DOM Nodes
    // A bare fork inherits Gradle's default 512m cap, which WebITest's
    // full-corpus reimport + incremental Lucene reindex on top of every
    // Spring context cached earlier in the same JVM exhausts (the
    // StringUTF16 OOM that killed Gradle Test Executor mid-WebITest).
    maxHeapSize = '2g'
    // ... and keep the TestContext cache itself bounded: unbounded, every
    // distinct context configuration from earlier classes stays cached for
    // the JVM's lifetime (~19 Hikari pools were resident at OOM time).
    systemProperty 'spring.test.context.cache.maxSize', '4'
    // Opt-in Java Flight Recorder profiling of a test fork:
    // $ ./gradlew -Pprofile=zmeu -Pjfr=/tmp/webitest.jfr integrationTest --tests '*WebITest'
    // ... or the same through rake (which loads the profile env itself):
    // $ TEST_JFR=/tmp/webitest.jfr rake itest[zmeu,WebITest]
    // Records CPU (ExecutionSample) + allocation sampling (settings=profile);
    // inspect with `jfr summary` / `jfr print --events jdk.ObjectAllocationSample`.
    final jfrTarget = System.getenv('TEST_JFR') ?: (project.findProperty('jfr') ?: null)
    if (jfrTarget) {
        jvmArgs "-XX:StartFlightRecording=filename=${jfrTarget},settings=profile,dumponexit=true"
    }
    // $ ./gradlew -Pprofile=ci test   (resolveProfile() below; the rakefile
    // always passes -Pprofile=<profile> this same way). Plain `test`/
    // `unittest`/`integrationTest` with nothing set default to 'ci' - the
    // conventional full suite runs against integration-deps.
    final resolvedProfile = resolveProfile('ci')
    systemProperty 'spring.profiles.active', resolvedProfile
    println "${name}: spring.profiles.active = " + resolvedProfile

    // Lucene indexing stays off for every test run under every profile: no
    // test needs the startup auto-build or the per-import incremental
    // reindex unless it deliberately tests that indexing behavior itself -
    // WebITest, the one exception, flips lucene.incremental.enabled back on
    // in its own @TestPropertySource, which outranks these system
    // properties. Mirrors the same two flags application-ci.properties
    // already sets false, so dev/prod/yoga test runs behave like ci ones
    // instead of paying a full fixture reindex per reimport-heavy class.
    systemProperty 'lucene.autoindex.enabled', 'false'
    systemProperty 'lucene.incremental.enabled', 'false'
    // ... and the index itself lives in a per-task scratch dir under build/,
    // never the real dev/int/prod index that lucene.index.dir otherwise
    // defaults to (${work.dir}/cache/lucene-index) - no test may even open,
    // let alone write, the live machine's index (see WebITest's own
    // isolation comment for the lock contention/corruption that causes).
    // The two tests that actually build/search a real index (WebITest,
    // LuceneSearchITest) pin their own temp dirs via
    // @TestPropertySource/@DynamicPropertySource, which outrank this
    // system property.
    systemProperty 'lucene.index.dir', layout.buildDirectory.dir("test-lucene-index/${name}").get().asFile.absolutePath

//    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
}

